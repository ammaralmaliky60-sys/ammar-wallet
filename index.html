<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1FF">
<meta name="color-scheme" content="light dark">
<script>
  (() => {
    let saved = null;
    try { saved = localStorage.getItem('thukhr-appearance-v1'); } catch { /* use device setting */ }
    const dark = saved === 'night' || (saved !== 'classic' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name="theme-color"]').content = dark ? '#110D1F' : '#F4F1FF';
  })();
</script>
<meta name="description" content="دبّرها — نظّم دخلك ومصروفك، وتابع الميزانية والتقارير. بياناتك تبقى على جهازك.">
